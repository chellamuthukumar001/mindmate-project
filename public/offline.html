<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindMate – Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a0533 0%, #0f172a 50%, #1a1a2e 100%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .orb1 {
      position: fixed; top: -5rem; left: -5rem;
      width: 20rem; height: 20rem;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139,92,246,0.3), transparent 70%);
      animation: pulse 4s infinite;
    }
    .orb2 {
      position: fixed; bottom: -5rem; right: -5rem;
      width: 20rem; height: 20rem;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.2), transparent 70%);
      animation: pulse 4s 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }
    .icon-wrap {
      width: 100px; height: 100px;
      border-radius: 28px;
      background: linear-gradient(135deg, #7C3AED, #8B5CF6);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 2rem;
      font-size: 3rem;
      box-shadow: 0 25px 50px rgba(139,92,246,0.4);
      position: relative; z-index: 1;
    }
    h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.75rem; position:relative;z-index:1; }
    p { color: rgba(255,255,255,0.6); font-size: 1rem; line-height: 1.6; max-width: 340px; margin: 0 auto 2.5rem; position:relative;z-index:1; }
    button {
      background: linear-gradient(135deg, #7C3AED, #6D28D9);
      color: white; border: none;
      padding: 0.875rem 2.5rem;
      border-radius: 50px;
      font-size: 1rem; font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(139,92,246,0.35);
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative; z-index: 1;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(139,92,246,0.5); }
    .status {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.4);
      position: relative; z-index: 1;
    }
    .dot {
      display: inline-block; width: 8px; height: 8px;
      background: #ef4444; border-radius: 50%; margin-right: 6px;
      animation: blink 2s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  </style>
</head>
<body>
  <div class="orb1"></div>
  <div class="orb2"></div>
  <div class="icon-wrap">🧠</div>
  <h1>You're Offline</h1>
  <p>MindMate needs an internet connection. Please check your connection and try again.</p>
  <button onclick="window.location.reload()">Try Again</button>
  <p class="status"><span class="dot"></span>No internet connection detected</p>
</body>
</html>
