<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="txt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- Inner glow -->
  <circle cx="256" cy="256" r="200" fill="white" fill-opacity="0.03"/>
  <!-- M letter -->
  <text x="256" y="340" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="270" text-anchor="middle" fill="url(#txt)">M</text>
  <!-- Sparkle star top-right -->
  <g transform="translate(380,95)">
    <circle r="22" fill="white" fill-opacity="0.9"/>
    <circle r="10" fill="#a78bfa"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="white" stroke-width="3" stroke-opacity="0.5"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="white" stroke-width="3" stroke-opacity="0.5"/>
  </g>
  <!-- Small dot bottom left -->
  <circle cx="135" cy="390" r="12" fill="white" fill-opacity="0.4"/>
</svg>
